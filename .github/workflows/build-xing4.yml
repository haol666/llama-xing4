# ==============================================================================
# GitHub Actions: Build llama.cpp Xing4.0 (PR #29012) Docker images
#
# Outputs to ghcr.io:
#   - llama-xing4:cpu         CPU, multi-arch (amd64 + arm64)          <- universal
#   - llama-xing4:cuda        CUDA 12.8.1 amd64 (all archs)
#   - llama-xing4:cuda-75     CUDA 12.8.1 Turing (2080Ti/T4)
#   - llama-xing4:cuda13      CUDA 13.4.1 amd64  (matches official cuda13)
#   - llama-xing4:cuda13-arm64 CUDA 13.4.1 arm64 (Grace-Blackwell/DGX Spark, sm_100f)
#
# CUDA 13.4.1 matches the official llama.cpp `cuda13` tag (upstream docker.yml),
# so the nvidia/cuda:13.4.1 base layers are SHARED with the official cuda13 image.
#
# Source: shuxiaoqiong/llama.cpp:xing4_0-port (PR #29012 head branch)
# NOTE: PR #29012 is still under review. The branch may be force-pushed;
#       each build clones the branch HEAD, so weekly builds track PR updates.
#
# Triggers:
#   - push to main (when Dockerfile or workflow changes)
#   - manual workflow_dispatch
#   - weekly schedule (rebuild with latest branch HEAD)
# ==============================================================================

name: Build Xing4.0 Docker Images

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile.cuda'
      - 'Dockerfile.cpu'
      - '.github/workflows/build-xing4.yml'
  workflow_dispatch:
    inputs:
      push_image:
        description: 'Push image to ghcr.io'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
  schedule:
    # Weekly rebuild every Monday UTC 02:00 (picks up PR branch updates)
    - cron: '0 2 * * 1'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ==========================================================================
  # JOB 0: CPU-only, multi-arch (amd64 + arm64) via buildx
  #   CPU has no GPU-driver dependency, so QEMU cross-arch build works.
  #   Output: :cpu (index manifest with both architectures)
  # ==========================================================================
  build-cpu:
    name: CPU (amd64+arm64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Lowercase repo name for image
        id: repo
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}
          tags: |
            type=raw,value=cpu
            type=raw,value=cpu-{{date 'YYYYMMDD'}}
            type=sha,prefix=cpu-

      - name: Build & push CPU image (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.cpu
          target: server
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' && (github.event.inputs.push_image != 'false') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        if: always()
        run: |
          echo "### CPU Build (amd64+arm64)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Tags: \`${{ steps.meta.outputs.tags }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY

  # ==========================================================================
  # JOB 1: CUDA 12.8.1 (legacy stable), amd64 only
  #   multi-arch all-archs + Turing-2080Ti special, parallel
  # ==========================================================================
  build-cuda:
    name: CUDA12 (${{ matrix.cuda_arch_label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - cuda_arch: "default"
            cuda_arch_label: "all-archs"
            tag_suffix: "cuda"
          - cuda_arch: "75"
            cuda_arch_label: "turing-2080Ti"
            tag_suffix: "cuda-75"
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Lowercase repo name for image
        id: repo
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}
          tags: |
            type=raw,value=${{ matrix.tag_suffix }}
            type=raw,value=${{ matrix.tag_suffix }}-{{date 'YYYYMMDD'}}
            type=sha,prefix=${{ matrix.tag_suffix }}-

      - name: Build & push CUDA12 image (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.cuda
          target: server
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' && (github.event.inputs.push_image != 'false') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CUDA_VERSION=12.8.1
            CUDA_DOCKER_ARCH=${{ matrix.cuda_arch }}
          no-cache: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        if: always()
        run: |
          echo "### CUDA12 Build: ${{ matrix.cuda_arch_label }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Architecture: \`${{ matrix.cuda_arch }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Tags: \`${{ steps.meta.outputs.tags }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY

  # ==========================================================================
  # JOB 2: CUDA 13.4.1 amd64 (matches official llama.cpp `cuda13` version)
  #   Amd64 native on x64 runner. Shared base layers with official cuda13.
  # ==========================================================================
  build-cuda13:
    name: CUDA13 amd64
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Lowercase repo name for image
        id: repo
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}
          tags: |
            type=raw,value=cuda13
            type=raw,value=cuda13-{{date 'YYYYMMDD'}}
            type=sha,prefix=cuda13-

      - name: Build & push CUDA13 image (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.cuda
          target: server
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' && (github.event.inputs.push_image != 'false') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CUDA_VERSION=13.4.1
            CUDA_DOCKER_ARCH=default
            BUILD_JOBS=8
          no-cache: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        if: always()
        run: |
          echo "### CUDA13 Build (amd64)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- CUDA 13.4.1 (matches official cuda13)" >> $GITHUB_STEP_SUMMARY
          echo "- Tags: \`${{ steps.meta.outputs.tags }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY

  # ==========================================================================
  # JOB 3: CUDA 13.4.1 arm64 (Grace-Blackwell / DGX Spark, sm_100f)
  #   MUST run on an arm64 native runner - nvcc cannot be QEMU-simulated.
  #   GitHub hosted arm64 runner: ubuntu-24.04-arm (public repo OK)
  #   CUDA_DOCKER_ARCH=100f => Blackwell (GB10 Grace-Blackwell)
  # ==========================================================================
  build-cuda13-arm64:
    name: CUDA13 arm64 (DGX Spark)
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Lowercase repo name for image
        id: repo
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}
          tags: |
            type=raw,value=cuda13-arm64
            type=raw,value=cuda13-arm64-{{date 'YYYYMMDD'}}
            type=sha,prefix=cuda13-arm64-

      - name: Build & push CUDA13 image (arm64, Blackwell)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.cuda
          target: server
          platforms: linux/arm64
          push: ${{ github.event_name != 'pull_request' && (github.event.inputs.push_image != 'false') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CUDA_VERSION=13.4.1
            CUDA_DOCKER_ARCH=100f
            BUILD_JOBS=8
          no-cache: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        if: always()
        run: |
          echo "### CUDA13 Build (arm64, DGX Spark / Grace-Blackwell)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- CUDA 13.4.1, arch sm_100f (Blackwell)" >> $GITHUB_STEP_SUMMARY
          echo "- Tags: \`${{ steps.meta.outputs.tags }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
