# ==============================================================================
# GitHub Actions: Build llama.cpp Xing4.0 (PR #29012) Docker images
#
# Outputs 3 images to ghcr.io:
#   - llama-xing4:cuda       CUDA 12.8.1, all supported archs (same as official)
#   - llama-xing4:cuda-75    CUDA 12.8.1, Turing arch (2080Ti/T4)
#   - llama-xing4:cpu        CPU-only
#
# Structure mirrors the official .devops/cuda.Dockerfile => base layers are
# SHARED with ghcr.io/ggml-org/llama.cpp:server-cuda (CUDA 12.8.1 runtime):
# pulling both images locally costs the shared base layers only once.
#
# Source: shuxiaoqiong/llama.cpp:xing4_0-port (PR #29012 head branch)
# NOTE: PR #29012 is still under review. The branch may be force-pushed;
#       each build clones the branch HEAD, so weekly builds track PR updates.
#
# Triggers:
#   - push to main (when Dockerfile or workflow changes)
#   - manual workflow_dispatch
#   - weekly schedule (rebuild with latest branch HEAD)
# ==============================================================================

name: Build Xing4.0 Docker Images

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile.cuda'
      - 'Dockerfile.cpu'
      - '.github/workflows/build-xing4.yml'
  workflow_dispatch:
    inputs:
      cuda_arch:
        description: 'CUDA_DOCKER_ARCH (default=all archs, 75=2080Ti/T4, 89=4090)'
        required: false
        default: 'default'
      push_image:
        description: 'Push image to ghcr.io'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
  schedule:
    # Weekly rebuild every Monday UTC 02:00 (picks up PR branch updates)
    - cron: '0 2 * * 1'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ==========================================================================
  # Job 1: CUDA images (multi-arch + turing, parallel)
  # ==========================================================================
  build-cuda:
    name: CUDA (${{ matrix.cuda_arch_label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - cuda_arch: "default"
            cuda_arch_label: "all-archs"
            tag_suffix: "cuda"
          - cuda_arch: "75"
            cuda_arch_label: "turing-2080Ti"
            tag_suffix: "cuda-75"
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Lowercase repo name for image
        id: repo
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}
          tags: |
            type=raw,value=${{ matrix.tag_suffix }}
            type=raw,value=${{ matrix.tag_suffix }}-{{date 'YYYYMMDD'}}
            type=sha,prefix=${{ matrix.tag_suffix }}-

      - name: Build & push CUDA image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.cuda
          target: server
          push: ${{ github.event_name != 'pull_request' && (github.event.inputs.push_image != 'false') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CUDA_DOCKER_ARCH=${{ matrix.cuda_arch }}
          no-cache: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        if: always()
        run: |
          echo "### CUDA Build: ${{ matrix.cuda_arch_label }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Architecture: \`${{ matrix.cuda_arch }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Tags: \`${{ steps.meta.outputs.tags }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY

  # ==========================================================================
  # Job 2: CPU-only image
  # ==========================================================================
  build-cpu:
    name: CPU-only
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Lowercase repo name for image
        id: repo
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}
          tags: |
            type=raw,value=cpu
            type=raw,value=cpu-{{date 'YYYYMMDD'}}
            type=sha,prefix=cpu-

      - name: Build & push CPU image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.cpu
          target: server
          push: ${{ github.event_name != 'pull_request' && (github.event.inputs.push_image != 'false') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        if: always()
        run: |
          echo "### CPU Build" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Tags: \`${{ steps.meta.outputs.tags }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
